<a class="skip" href="#main">Skip to content</a>
<div class="screen" [class.full]="fullBleed()">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" routerLink="/">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-text">
          @if (op.multiAgency()) {
            <span class="brand-op">Bay Area Transit</span>
            <span class="brand-sub">{{ op.name() }}</span>
          } @else {
            <span class="brand-op">{{ op.name() }}</span>
            <span class="brand-sub">Bay Area Transit</span>
          }
        </span>
      </a>
      <app-realtime-indicator />
    </div>
    <nav class="wrap tabs" aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Trips</a>
      <a routerLink="/map" routerLinkActive="active">Map</a>
    </nav>
  </header>

  <div class="wrap">
    <app-alerts-banner />
  </div>

  <main id="main" class="wrap">
    <router-outlet />
  </main>
</div>

<footer class="wrap footer" [class.full]="fullBleed()">
  <app-feed-note />
</footer>
