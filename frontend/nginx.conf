# SPA + API reverse proxy for the bay-area-transit frontend.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;

    # Resolve "backend" at request time via Docker's DNS, so nginx starts even
    # if the backend container isn't up yet (and follows it if it restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css,
    # and the leaflet images esbuild fingerprints): cache for a year.
    location ~* "-[A-Za-z0-9_]{8,}\.(?:js|css|png|jpg|svg|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Unhashed static files from public/ (favicon.svg): short cache.
    location ~* \.(?:ico|svg|png|webmanifest|txt)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Everything else is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
